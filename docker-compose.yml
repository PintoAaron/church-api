services:
  church-backend:
    build: .
    container_name: church-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - default
    depends_on:
      - church-postgres
      - church-redis


  church-postgres:
    image: postgres
    container_name: church-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5000:5432"

  church-redis:
    image: redis
    container_name: church-redis
    restart: always
    ports:
      - "6377:6379"
